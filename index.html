<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbitech News | Industry Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --scroll-pct: 0%;
            --scroll-num: 0;

            /* Atmospheric Multi-stop Night Palette */
            --night-top: #04060a;
            --night-mid: #0b0e1a;
            --night-base: #181428;
            --night-accent: #a855f7;
            --night-sweep: rgba(168, 85, 247, 0.32);

            /* Atmospheric Sunset/Day Palette */
            --day-top: #1a162b;
            --day-mid: #5c2438;
            --day-base: #b44322;
            --day-accent: #fbbf24;
            --day-sweep: rgba(245, 158, 11, 0.45);

            /* Dynamic Blended Engine */
            --c-top: color-mix(in srgb, var(--day-top) var(--scroll-pct), var(--night-top));
            --c-mid: color-mix(in srgb, var(--day-mid) var(--scroll-pct), var(--night-mid));
            --c-base: color-mix(in srgb, var(--day-base) var(--scroll-pct), var(--night-base));
            --c-accent: color-mix(in srgb, var(--day-accent) var(--scroll-pct), var(--night-accent));
            --c-sweep: color-mix(in srgb, var(--day-sweep) var(--scroll-pct), var(--night-sweep));

            /* Surfaces & Typography */
            --nav-bg: #ffffff;
            --card-surface: rgba(13, 16, 26, 0.78);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 4%;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background: linear-gradient(165deg, var(--c-top) 0%, var(--c-mid) 45%, var(--c-base) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.15s ease-out;
        }

        /* --- CLEAN CELESTIAL SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a0d18 0%, #030508 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            overflow: hidden;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        .celestial-wheel-wrap {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .celestial-wheel {
            position: absolute;
            width: 180px;
            height: 180px;
            animation: rotateSky 3.2s linear infinite;
        }

        @keyframes rotateSky {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glowing-sun {
            position: absolute;
            top: -24px;
            left: calc(50% - 24px);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffb703;
            box-shadow: 0 0 0 2px #fff3b0, 0 0 20px #fb8500, 0 0 45px #ffb703, 0 0 70px rgba(251, 133, 0, 0.60);
        }

        .glowing-moon {
            position: absolute;
            bottom: -20px;
            left: calc(50% - 20px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e7ff;
            box-shadow: 0 0 0 2px #ffffff, 0 0 16px #c7d2fe, 0 0 35px rgba(199, 210, 254, 0.85), 0 0 55px rgba(165, 180, 252, 0.45);
        }

        .splash-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #f8fafc;
            z-index: 10;
        }

        .splash-status {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseStatus 1.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes pulseStatus {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* --- CELESTIAL BACKGROUND ELEMENTS --- */
        .stars-canvas-1 {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            opacity: calc(1 - (var(--scroll-num) * 2.2));
            background-image: 
                radial-gradient(1.5px 1.5px at 25px 35px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 110px 140px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 210px 70px, #f8fafc, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 320px 240px, #cbd5e1, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 430px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 560px 290px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 690px 90px, #f8fafc, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 810px 210px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 930px 130px, #cbd5e1, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1070px 270px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 1210px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1340px 190px, #f8fafc, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 550px 550px; animation: slowTwinkleA 7s ease-in-out infinite alternate;
        }

        .stars-canvas-2 {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            opacity: calc(0.85 - (var(--scroll-num) * 2.2));
            background-image: 
                radial-gradient(2px 2px at 60px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 220px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 280px 110px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 390px 320px, #cbd5e1, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 510px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 670px 270px, #f8fafc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 790px 150px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 940px 330px, #cbd5e1, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 1120px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 1280px 290px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 720px 720px; animation: slowTwinkleB 11s ease-in-out infinite alternate;
        }

        @keyframes slowTwinkleA { 0% { opacity: calc(0.55 - (var(--scroll-num) * 2.2)); } 50% { opacity: calc(1.0 - (var(--scroll-num) * 2.2)); } 100% { opacity: calc(0.7 - (var(--scroll-num) * 2.2)); } }
        @keyframes slowTwinkleB { 0% { opacity: calc(0.9 - (var(--scroll-num) * 2.2)); } 50% { opacity: calc(0.4 - (var(--scroll-num) * 2.2)); } 100% { opacity: calc(1.0 - (var(--scroll-num) * 2.2)); } }

        .shooting-star {
            position: fixed; top: 0; left: 0; width: 120px; height: 2px;
            background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0.4), transparent);
            border-radius: 50%; pointer-events: none; z-index: 1; opacity: 0; transform-origin: left center;
        }

        /* Celestial Bodies */
        .moon-wrapper {
            position: fixed; top: -240px; left: 50%; transform: translateX(-50%) translateY(calc(var(--scroll-num) * 120px));
            width: 480px; height: 480px; pointer-events: none; z-index: 0;
            opacity: calc(1 - (var(--scroll-num) * 1.8)); transition: opacity 0.2s ease-out;
        }
        .moon-halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, rgba(203, 213, 225, 0.2) 45%, transparent 70%); filter: blur(40px); }
        .moon-core { position: absolute; inset: 50px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, #ffffff 0%, #e2e8f0 45%, #94a3b8 85%); filter: blur(14px); box-shadow: inset -15px -15px 35px rgba(15, 23, 42, 0.5); }

        .sun-wrapper {
            position: fixed; bottom: -360px; left: 50%; transform: translateX(-50%) translateY(calc((1 - var(--scroll-num)) * 220px));
            width: 540px; height: 540px; pointer-events: none; z-index: 0;
            opacity: calc((var(--scroll-num) - 0.2) * 1.5); transition: opacity 0.2s ease-out;
        }
        .sun-halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.6) 0%, rgba(234, 88, 12, 0.35) 48%, transparent 70%); filter: blur(45px); }
        .sun-core { position: absolute; inset: 60px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #f59e0b 0%, #ea580c 60%, #c2410c 100%); filter: blur(16px); }

        .dissolve-horizon {
            position: fixed; top: 0; left: 0; width: 100%; height: 48px; z-index: 45;
            pointer-events: none; background: linear-gradient(to bottom, var(--c-top) 30%, transparent 100%);
        }

        /* --- SOLID, THIN TOP NAV BAR --- */
        .header-wrap { position: sticky; top: 0; z-index: 100; padding: 10px 0 4px 0; }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; background: #ffffff;
            padding: 7px 20px; border-radius: 50px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .nav-brand {
            color: #090a10; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0;
        }

        .nav-celestial-logo {
            width: 20px; height: 20px; border-radius: 50%; position: relative;
            background: color-mix(in srgb, #f59e0b var(--scroll-pct), #cbd5e1);
            box-shadow: 0 0 8px color-mix(in srgb, rgba(245, 158, 11, 0.8) var(--scroll-pct), rgba(203, 213, 225, 0.8));
            transition: transform 0.3s ease; overflow: hidden; flex-shrink: 0;
        }
        .nav-celestial-logo::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 65% 35%, transparent 40%, rgba(15, 23, 42, 0.35) 70%);
            opacity: calc(1 - var(--scroll-num) * 1.5);
        }

        .search-container {
            display: flex; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1;
            border-radius: 50px; padding: 0 12px; height: 32px; width: 220px; transition: all 0.2s;
        }
        .search-container:focus-within { background: #ffffff; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); width: 250px; }
        .search-icon { width: 14px; height: 14px; color: #64748b; flex-shrink: 0; margin-right: 8px; }
        .search-bar { width: 100%; border: none; background: transparent; color: #0f172a; font-size: 13px; padding: 0; outline: none; }

        /* --- LAYOUT & PANELS --- */
        .workspace { position: relative; z-index: 1; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: start; }
        
        .left-panel { position: sticky; top: 68px; height: calc(100vh - 84px); display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
        .hero-container { flex: 2; display: flex; flex-direction: column; justify-content: flex-start; min-height: 0; }
        .hero-title { font-size: 3.4rem; line-height: 1.04; margin: 0 0 10px 0; font-weight: 800; letter-spacing: -2px; color: var(--c-accent); text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); transition: color 0.15s ease-out; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text-muted); margin: 0 0 12px 0; }

        .headline-card {
            background: var(--card-surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 22px 24px;
            backdrop-filter: blur(18px); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35); flex-grow: 1;
            display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .headline-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.02) 65%, var(--c-sweep) 100%);
            transition: left 1.25s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0;
        }
        .headline-card:hover { transform: translateX(-4px); border-color: rgba(255, 255, 255, 0.22); }
        .headline-card:hover::before { left: 0; }
        .headline-card:hover #hero-headline { color: var(--c-accent) !important; }
        .headline-card > * { position: relative; z-index: 1; }
        .headline-snippet { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin: 0; padding-left: 20px; }

        /* Read Later */
        .read-later-box {
            flex: 1; min-height: 140px; background: var(--card-surface); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 14px 18px; backdrop-filter: blur(20px); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; scroll-margin-top: 80px;
        }
        .read-later-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; margin-bottom: 6px; flex-shrink: 0; }
        .read-later-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: var(--c-accent); }
        
        #bookmarks-container { overflow-y: auto; padding-right: 4px; flex-grow: 1; display: flex; flex-direction: column; gap: 6px; }
        #bookmarks-container::-webkit-scrollbar { width: 4px; }
        #bookmarks-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        .bookmark-item {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px; min-height: 38px; position: relative; overflow: hidden; transition: transform 0.25s ease, border-color 0.25s ease;
        }
        .bookmark-item::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.02) 65%, var(--c-sweep) 100%);
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0;
        }
        .bookmark-item:hover { transform: translateX(4px); border-color: rgba(255, 255, 255, 0.2); }
        .bookmark-item:hover::before { left: 0; }
        .bookmark-title { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 86%; color: #cbd5e1; text-decoration: none; position: relative; z-index: 1; }
        .bookmark-title:hover { color: #ffffff; }
        .remove-btn { background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 14px; transition: color 0.15s, transform 0.15s; position: relative; z-index: 1; }
        .remove-btn:hover { color: #ef4444; transform: scale(1.2); }

        /* --- RIGHT COLUMN & WIDGETS --- */
        .right-panel { position: relative; display: flex; flex-direction: column; gap: 24px; padding-top: 10px; padding-bottom: 120px; }

        /* Course Comparator Widget */
        .course-comparator-box {
            background: var(--card-surface); border: 1px solid var(--card-border); border-radius: 16px;
            padding: 20px; backdrop-filter: blur(18px); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25); position: relative;
        }
        .course-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .course-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: var(--c-accent); margin: 0; }
        
        .course-select {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main);
            padding: 6px 12px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer;
        }
        .course-select:focus { border-color: var(--c-accent); }
        .course-select option { background: #0b0e1a; color: #f8fafc; } /* Fix for white text on white background */

        .course-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .course-card-link { text-decoration: none; color: inherit; display: block; }
        .course-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px;
            padding: 14px; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; height: 100%;
        }
        .course-card-link:hover .course-card { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.2); }
        .course-type { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 50px; display: inline-block; margin-bottom: 8px; }
        .type-free { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .type-paid { background: rgba(234, 179, 8, 0.15); color: #facc15; }
        .course-name { font-size: 13.5px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; line-height: 1.3; transition: color 0.2s; }
        .course-card-link:hover .course-name { color: var(--c-accent); }
        .course-provider { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; margin-top: 8px;}

        /* Github Carousel */
        .github-carousel-box {
            background: var(--card-surface); border: 1px solid var(--card-border); border-radius: 16px;
            padding: 18px 20px; backdrop-filter: blur(18px); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
            position: relative; user-select: none; overflow: hidden;
        }
        .carousel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .github-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: var(--c-accent); margin: 0; }
        .carousel-nav { display: flex; align-items: center; gap: 8px; }
        .nav-arrow { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); color: var(--text-main); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.2s; }
        .nav-arrow:hover { background: var(--c-accent); color: #0b0e17; border-color: var(--c-accent); }
        .repo-slide-stage { min-height: 75px; position: relative; overflow: hidden; }
        .repo-card-single { display: flex; flex-direction: column; }
        .slide-in-right { animation: slideRight 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-in-left { animation: slideLeft 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        .repo-name { font-size: 14px; font-weight: 700; color: var(--text-main); text-decoration: none; }
        .repo-name:hover { color: var(--c-accent); }
        .repo-stars { font-size: 11px; color: #fbbf24; font-weight: 700; margin-left: 8px; }
        .repo-desc { font-size: 12px; color: var(--text-muted); margin: 6px 0 0 0; line-height: 1.45; }
        .carousel-indicators { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); transition: all 0.3s; }
        .dot.active { width: 18px; border-radius: 10px; background: var(--c-accent); }

        /* Filter Chips */
        .controls-row {
            display: flex; justify-content: space-between; align-items: center; background: var(--card-surface);
            padding: 8px 14px; border-radius: 50px; border: 1px solid var(--card-border); backdrop-filter: blur(18px);
        }
        .chip-group { display: flex; gap: 6px; }
        .chip { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted); padding: 5px 14px; border-radius: 50px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .chip:hover { color: white; transform: scale(1.03); }
        .chip.active { background: var(--c-accent); border-color: var(--c-accent); color: #0b0e17; font-weight: 700; }

        /* News Cards */
        .news-list { display: flex; flex-direction: column; gap: 18px; }
        .news-card-link { text-decoration: none; color: inherit; display: block; }
        .news-card {
            background: var(--card-surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 22px 24px;
            position: relative; backdrop-filter: blur(20px); overflow: hidden; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .news-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.02) 65%, var(--c-sweep) 100%);
            transition: left 1.25s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0;
        }
        .news-card-link:hover .news-card { transform: translateX(-6px); border-color: rgba(255, 255, 255, 0.22); }
        .news-card-link:hover .news-card::before { left: 0; }
        .news-card > * { position: relative; z-index: 1; }

        .tag-badge { font-size: 9.5px; font-weight: 700; background: rgba(255, 255, 255, 0.08); padding: 3px 9px; border-radius: 50px; display: inline-block; margin-bottom: 10px; letter-spacing: 0.5px; }
        .news-title { margin: 0 0 8px 0; font-size: 1.18rem; line-height: 1.35; color: var(--text-main); transition: color 0.15s; }
        .news-card-link:hover .news-title { color: var(--c-accent); }
        .news-desc { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px 0; line-height: 1.5; }
        .news-meta { font-size: 11.5px; color: var(--c-accent); font-weight: 600; }
        .card-save-btn {
            position: absolute; top: 18px; right: 18px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main); border-radius: 50px; cursor: pointer; font-size: 10.5px; font-weight: 600; padding: 4px 12px; transition: all 0.2s; z-index: 2;
        }
        .card-save-btn:hover { background: #ffffff; color: #0b0e17; transform: scale(1.04); }

        .error-card { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 14px; border-radius: 12px; font-size: 12.5px; display: none; }

        /* --- RESPONSIVE MOBILE & TABLET LAYOUT (< 960px) --- */
        @media (max-width: 960px) {
            body { padding: 0 3%; }
            .navbar { flex-direction: row; justify-content: space-between; gap: 10px; border-radius: 50px; padding: 6px 14px; }
            .search-container { width: 45%; max-width: 180px; height: 30px; }
            .search-container:focus-within { width: 55%; }
            .workspace { grid-template-columns: 1fr; gap: 28px; }
            .left-panel { position: static; height: auto; padding-bottom: 0; }
            .hero-title { font-size: 2.5rem; letter-spacing: -1px; }
            .headline-card { padding: 18px; min-height: auto; }
            #hero-headline { font-size: 1.3rem !important; }
            .read-later-box { max-height: 220px; }
            .right-panel { padding-top: 0; padding-bottom: 60px; }
            .moon-wrapper { width: 320px; height: 320px; top: -160px; }
            .sun-wrapper { width: 360px; height: 360px; bottom: -220px; }
            .course-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .navbar { padding: 6px 12px; }
            .nav-brand { font-size: 0.95rem; }
            .search-container { width: 44%; }
            .hero-title { font-size: 2rem; }
            .controls-row { flex-direction: column; gap: 8px; border-radius: 20px; padding: 10px; }
            .chip-group { width: 100%; justify-content: space-between; }
            .chip { padding: 4px 10px; font-size: 10.5px; }
        }

        /* --- ACCESSIBILITY --- */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .stars-canvas-1, .stars-canvas-2, .shooting-star { display: none; }
            .celestial-wheel { animation: none; }
        }
    </style>
</head>
<body>

    <!-- PRELOADER SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="celestial-wheel-wrap">
            <div class="celestial-wheel">
                <div class="glowing-sun"></div>
                <div class="glowing-moon"></div>
            </div>
        </div>
        <div class="splash-brand">
            <span style="background: linear-gradient(135deg, #fbbf24, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Orbitech News</span>
        </div>
        <div class="splash-status" id="splash-status-text">Synchronizing orbital feeds...</div>
    </div>

    <!-- STARFIELDS & SHOOTING STARS -->
    <div class="stars-canvas-1"></div>
    <div class="stars-canvas-2"></div>
    <div id="shooting-star-container"></div>

    <!-- CELESTIAL BODIES & HORIZON -->
    <div class="moon-wrapper"><div class="moon-halo"></div><div class="moon-core"></div></div>
    <div class="sun-wrapper"><div class="sun-halo"></div><div class="sun-core"></div></div>
    <div class="dissolve-horizon"></div>

    <!-- NAVBAR -->
    <header class="header-wrap">
        <nav class="navbar">
            <a href="#" class="nav-brand">
                <div class="nav-celestial-logo" id="nav-logo" title="Celestial Horizon Indicator"></div>
                Orbitech News
            </a>
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-bar" autocomplete="off" spellcheck="false">
            </div>
        </nav>
    </header>

    <!-- WORKSPACE -->
    <main class="workspace">

        <!-- LEFT PANEL -->
        <section class="left-panel">
            <div class="hero-container">
                <h1 class="hero-title">Crafting narrative<br>through tech.</h1>
                <p class="hero-subtitle">The biggest story in the industry right now:</p>
                <div class="headline-card" id="headline-container">
                    <!-- Injected via JS -->
                </div>
                <div id="error-box" class="error-card" style="margin-top: 10px;"></div>
            </div>

            <div class="read-later-box" id="bookmarks-section">
                <div class="read-later-header">
                    <span>Read Later</span>
                    <span id="bookmark-count" style="color: var(--text-muted); font-size: 10px;">0 saved</span>
                </div>
                <div id="bookmarks-container"></div>
            </div>
        </section>

        <!-- RIGHT PANEL -->
        <section class="right-panel">

            <!-- WIDGET: Course Comparator -->
            <div class="course-comparator-box">
                <div class="course-header">
                    <h3 class="course-title">Orbital Academy: Course Matrix</h3>
                    <select class="course-select" id="course-topic-select" onchange="loadCourses()">
                        <option value="dsa">Data Structures & Algorithms</option>
                        <option value="java">Java Programming</option>
                        <option value="python">Python Programming</option>
                        <option value="ruby">Ruby / Processing</option>
                        <option value="js">JavaScript / Web</option>
                    </select>
                </div>
                <div class="course-grid" id="course-grid">
                    <!-- Courses Injected Here -->
                </div>
            </div>

            <!-- WIDGET: Github Carousel -->
            <div class="github-carousel-box" id="repo-carousel-container">
                <div class="carousel-top">
                    <div class="github-title">Trending Github Repositories</div>
                    <div class="carousel-nav">
                        <button class="nav-arrow" onclick="shiftRepo(-1, 'left')" title="Previous">‹</button>
                        <button class="nav-arrow" onclick="shiftRepo(1, 'right')" title="Next">›</button>
                    </div>
                </div>
                <div class="repo-slide-stage" id="carousel-stage">Loading repositories...</div>
                <div class="carousel-indicators" id="carousel-dots"></div>
            </div>

            <!-- Feed Controls -->
            <div class="controls-row">
                <div class="chip-group">
                    <button class="chip active" onclick="setCategory('all', this)">All</button>
                    <button class="chip" onclick="setCategory('ai', this)">AI</button>
                    <button class="chip" onclick="setCategory('cloud', this)">Cloud</button>
                    <button class="chip" onclick="setCategory('hardware', this)">Hardware</button>
                </div>
                <span id="feed-status" style="font-size: 11px; color: var(--text-muted);">Real-time</span>
            </div>

            <!-- News Feed -->
            <div class="news-list" id="news-container"></div>
        </section>
    </main>

    <script>
        // --- 1. Throttled Celestial Scroll ---
        let isTicking = false;
        window.addEventListener('scroll', () => {
            if (!isTicking) {
                window.requestAnimationFrame(() => {
                    const scrollTop = window.scrollY;
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const scrollRatio = docHeight > 0 ? Math.min(1, Math.max(0, scrollTop / docHeight)) : 0;
                    document.documentElement.style.setProperty('--scroll-pct', `${scrollRatio * 100}%`);
                    document.documentElement.style.setProperty('--scroll-num', scrollRatio.toFixed(3));
                    isTicking = false;
                });
                isTicking = true;
            }
        }, { passive: true });

        // --- 2. Shooting Star Engine ---
        function launchShootingStar() {
            const currentScroll = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scroll-num')) || 0;
            if (currentScroll > 0.45) { setTimeout(launchShootingStar, 3000); return; }
            const star = document.createElement('div');
            star.className = 'shooting-star';
            const startX = Math.random() * (window.innerWidth * 0.75);
            const startY = Math.random() * (window.innerHeight * 0.45);
            const angle = 25 + Math.random() * 20;
            star.style.left = `${startX}px`; star.style.top = `${startY}px`; star.style.transform = `rotate(${angle}deg)`;
            document.getElementById('shooting-star-container').appendChild(star);
            const anim = star.animate([
                { transform: `rotate(${angle}deg) translateX(0)`, opacity: 0 },
                { transform: `rotate(${angle}deg) translateX(80px)`, opacity: 1, offset: 0.2 },
                { transform: `rotate(${angle}deg) translateX(280px)`, opacity: 0 }
            ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
            anim.onfinish = () => star.remove();
            setTimeout(launchShootingStar, 4000 + Math.random() * 5000);
        }
        setTimeout(launchShootingStar, 1500);

        // --- 3. Orbital Academy: Course Data Engine ---
        const courseDB = {
            dsa: [
                { type: 'Free', class: 'type-free', title: 'MIT 6.006: Intro to Algorithms', provider: 'MIT OpenCourseWare', url: 'https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/' },
                { type: 'Visual', class: 'type-paid', title: 'Grokking Algorithms', provider: 'Manning Publications', url: 'https://www.manning.com/books/grokking-algorithms-second-edition' }
            ],
            java: [
                { type: 'Free', class: 'type-free', title: 'MOOC.fi: Object-Oriented Java', provider: 'Univ. of Helsinki', url: 'https://java-programming.mooc.fi/' },
                { type: 'Ref', class: 'type-paid', title: 'Effective Java (3rd Edition)', provider: 'Joshua Bloch', url: 'https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/' }
            ],
            python: [
                { type: 'Free', class: 'type-free', title: 'CS50P: Programming with Python', provider: 'HarvardX', url: 'https://cs50.harvard.edu/python/' },
                { type: 'Paid', class: 'type-paid', title: 'Automate the Boring Stuff', provider: 'Al Sweigart', url: 'https://automatetheboringstuff.com/' }
            ],
            ruby: [
                { type: 'Free', class: 'type-free', title: 'The Odin Project: Ruby Path', provider: 'Open Source', url: 'https://www.theodinproject.com/paths/full-stack-ruby-on-rails' },
                { type: 'Visual', class: 'type-free', title: 'Processing Interactive Tutorials', provider: 'Processing.org', url: 'https://processing.org/tutorials' }
            ],
            js: [
                { type: 'Free', class: 'type-free', title: 'JavaScript Algorithms & DSA', provider: 'freeCodeCamp', url: 'https://www.freecodecamp.org/learn/javascript-algorithms-and-data-structures-v8/' },
                { type: 'Deep', class: 'type-paid', title: 'Just JavaScript', provider: 'Dan Abramov', url: 'https://justjavascript.com/' }
            ]
        };

        function loadCourses() {
            const topic = document.getElementById('course-topic-select').value;
            const courses = courseDB[topic];
            const grid = document.getElementById('course-grid');
            grid.innerHTML = '';
            courses.forEach(c => {
                grid.innerHTML += `
                    <a href="${c.url}" target="_blank" rel="noopener" class="course-card-link">
                        <div class="course-card">
                            <div>
                                <span class="course-type ${c.class}">${c.type}</span>
                                <div class="course-name">${c.title}</div>
                            </div>
                            <div class="course-provider">
                                <span>🎓 ${c.provider}</span>
                                <span style="font-size: 14px;">→</span>
                            </div>
                        </div>
                    </a>
                `;
            });
        }

        // --- 4. News & Repos State ---
        let allArticles = [];
        let activeCategory = 'all';
        let repos = [];
        let currentRepoIdx = 0;
        let carouselTimer = null;

        async function fetchNews() {
            const response = await fetch('https://dev.to/api/articles?tags=cloud,hardware,ai,software&per_page=14');
            if (!response.ok) throw new Error("HTTP error " + response.status);
            allArticles = await response.json();
            if (!allArticles.length) throw new Error("No articles received.");

            const heroItem = allArticles[0];
            const safeSnippet = heroItem.description ? (heroItem.description.length > 175 ? heroItem.description.substring(0, 172) + '...' : heroItem.description) : 'Click headline to read full journalistic coverage.';
            
            document.getElementById('headline-container').innerHTML = `
                <a href="${heroItem.url}" target="_blank" rel="noopener" style="text-decoration: none; color: inherit; display: block; position: relative; z-index: 1;">
                    <div id="hero-headline" style="color: var(--text-main); font-size: 1.55rem; font-weight: 700; line-height: 1.25; border-left: 4px solid var(--c-accent); padding-left: 16px; margin-bottom: 12px; transition: color 0.15s;">
                        ${heroItem.title}
                    </div>
                    <p id="hero-snippet" class="headline-snippet">${safeSnippet}</p>
                </a>
            `;
            applyFilter();
        }

        async function fetchGitHub() {
            try {
                const res = await fetch('https://api.github.com/search/repositories?q=stars:>6000+topic:developer-tools&sort=updated&per_page=5');
                const data = await res.json();
                repos = data.items || [];
                if (repos.length) { renderRepoSlide('right'); startCarouselAuto(); }
            } catch (e) { document.getElementById('carousel-stage').innerHTML = '<span style="font-size:11px;color:var(--text-muted);">Repo feed unavailable.</span>'; }
        }

        function renderRepoSlide(direction = 'right') {
            const stage = document.getElementById('carousel-stage');
            const dotsContainer = document.getElementById('carousel-dots');
            const repo = repos[currentRepoIdx];
            if (!repo) return;
            const desc = repo.description ? (repo.description.length > 95 ? repo.description.substring(0, 92) + '...' : repo.description) : 'High-impact open-source developer tooling.';
            const animClass = direction === 'right' ? 'slide-in-right' : 'slide-in-left';
            stage.innerHTML = `
                <div class="repo-card-single ${animClass}">
                    <div><a href="${repo.html_url}" target="_blank" rel="noopener" class="repo-name">${repo.full_name}</a><span class="repo-stars">★ ${(repo.stargazers_count / 1000).toFixed(1)}k</span></div>
                    <p class="repo-desc">${desc}</p>
                </div>
            `;
            dotsContainer.innerHTML = repos.map((_, i) => `<div class="dot ${i === currentRepoIdx ? 'active' : ''}"></div>`).join('');
        }

        function shiftRepo(step, direction = 'right') {
            if (!repos.length) return;
            currentRepoIdx = (currentRepoIdx + step + repos.length) % repos.length;
            renderRepoSlide(direction); resetCarouselTimer();
        }

        function startCarouselAuto() { carouselTimer = setInterval(() => shiftRepo(1, 'right'), 5500); }
        function resetCarouselTimer() { clearInterval(carouselTimer); startCarouselAuto(); }

        // --- 5. Feed Filtering & Rendering ---
        function renderNews(articles) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            if (!articles.length) { container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">No matching articles found.</div>'; return; }

            articles.forEach(article => {
                const readTime = Math.ceil((article.description ? article.description.length * 4 : 450) / 238);
                const tag = article.tags.split(',')[0] || 'TECH';
                const safeTitle = article.title.replace(/'/g, "\\'");
                container.innerHTML += `
                    <a href="${article.url}" target="_blank" rel="noopener" class="news-card-link">
                        <article class="news-card">
                            <span class="tag-badge">${tag.toUpperCase()}</span>
                            <button class="card-save-btn" onclick="event.preventDefault(); saveBookmark('${article.id}', '${safeTitle}', '${article.url}')">Save</button>
                            <h2 class="news-title">${article.title}</h2>
                            <p class="news-desc">${article.description || 'Click to read full coverage on this developing story.'}</p>
                            <span class="news-meta">⏱ ${readTime} min read</span>
                        </article>
                    </a>
                `;
            });
        }

        function setCategory(category, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active'); activeCategory = category; applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = allArticles.slice(1).filter(a => (a.title.toLowerCase().includes(query) || a.tags.toLowerCase().includes(query)) && (activeCategory === 'all' || a.tags.toLowerCase().includes(activeCategory)));
            renderNews(filtered);
        }
        document.getElementById('search-input').addEventListener('input', applyFilter);

        // --- 6. Bookmarks ---
        window.saveBookmark = function(id, title, url) {
            let list = JSON.parse(localStorage.getItem('eterna_bookmarks')) || [];
            if (!list.some(b => b.id === id)) { list.push({ id, title, url }); localStorage.setItem('eterna_bookmarks', JSON.stringify(list)); loadBookmarks(); }
        };

        window.removeBookmark = function(id) {
            let list = JSON.parse(localStorage.getItem('eterna_bookmarks')) || [];
            list = list.filter(b => String(b.id) !== String(id)); localStorage.setItem('eterna_bookmarks', JSON.stringify(list)); loadBookmarks();
        };

        function loadBookmarks() {
            const list = JSON.parse(localStorage.getItem('eterna_bookmarks')) || [];
            const container = document.getElementById('bookmarks-container');
            document.getElementById('bookmark-count').innerText = `${list.length} saved`;
            if (!list.length) { container.innerHTML = '<div style="font-size:11px;color:var(--text-muted);font-style:italic;padding-top:14px;text-align:center;">No articles saved yet.</div>'; return; }
            container.innerHTML = '';
            list.forEach(b => {
                container.innerHTML += `
                    <div class="bookmark-item">
                        <a href="${b.url}" target="_blank" rel="noopener" class="bookmark-title" title="${b.title}">${b.title}</a>
                        <button class="remove-btn" onclick="removeBookmark('${b.id}')" title="Remove">✕</button>
                    </div>
                `;
            });
        }

        // --- 7. Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            loadBookmarks(); loadCourses();
            const splashTimer = new Promise(resolve => setTimeout(resolve, 3200));
            const newsPromise = fetchNews().catch(err => { document.getElementById('error-box').style.display = 'block'; document.getElementById('error-box').innerText = `News feed unavailable: ${err.message}`; });
            const githubPromise = fetchGitHub();
            await Promise.all([splashTimer, newsPromise, githubPromise]);
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0'; setTimeout(() => splash.remove(), 800);
        });
    </script>
</body>
</html>
